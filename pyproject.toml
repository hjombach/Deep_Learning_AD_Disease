[project]
name = "deep-learning-ad-disease"
version = "0.1.0"
description = "Graph convolution neural networks for Alzheimer's disease treatment nominations"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas (>=2.0)",
    "numpy (>=1.24)",
    "scikit-learn (>=1.3)",
    "deepchem (>=2.8)",
    "rdkit (>=2023.9)",
    "matplotlib (>=3.7)",
    "seaborn (>=0.13)",
    "openpyxl (>=3.1)",
    "torch (>=2.0)",
    "pytz (>=2023.3)",
    "tensorflow (>=2.14,<2.16)",
    "keras (>=2.14,<3)",
    "pubchempy (>=1.0)",
    "tqdm (>=4.66)",
    "joblib (>=1.3)",
    "pillow (>=10.0)",
    "ipykernel (>=6.25)",
    "ipython (>=8.12)",
    "jupyter (>=1.0)",
    "notebook (>=7.0)",
    "pyarrow (>=19,<20)",
    "pandarallel (>=1.6.5,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
